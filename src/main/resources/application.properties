spring.application.name=dead-letter-queue

# Local embedded H2 database (state directory). Override dlq.data-dir / spring.datasource.url per environment.
spring.datasource.url=jdbc:h2:file:${dlq.data-dir:./data/dlq}/dlqdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Retry policy defaults (per message override allowed at enqueue time)
dlq.data-dir=./data/dlq
dlq.retry.max-retries=3
dlq.retry.initial-backoff-ms=1000
dlq.retry.max-backoff-ms=60000
dlq.retry.backoff-type=EXPONENTIAL

# Delivery lease: messages whose lease expires are redelivered (at-least-once)
dlq.dispatch.lease-ttl-ms=30000
dlq.dispatch.poll-timeout-ms=200

# Dead letter retention: age and total count caps, sweep runs periodically
dlq.retention.max-age-ms=604800000
dlq.retention.max-records=10000
dlq.retention.sweep-interval-ms=60000

spring.jackson.serialization.write-dates-as-timestamps=false
