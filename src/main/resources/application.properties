# 死信队列本地状态存储目录
dlq.store-dir=data/dlq
# 消息可见性超时（租约），超时未回执将重新投递
dlq.visibility-timeout-millis=30000
# 后台维护扫描间隔
dlq.maintenance-interval-millis=1000
# 死信保留时长，0 表示不按时间淘汰
dlq.retention-millis=0
# 死信区总量上限，0 表示不限制
dlq.max-dead-records=0
# 默认重试策略
dlq.default-max-retries=3
dlq.default-initial-interval-millis=1000
dlq.default-max-interval-millis=60000
dlq.default-backoff-type=EXPONENTIAL
